<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas Médicas</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    

</head>


<body>


<!-- ========================================= -->
<!-- HEADER -->
<!-- ========================================= -->


<aside class="sidebar-moderna">
    
    <!-- Logo y Marca -->
    <div class="brand-moderna">
        <img src="imagenes/logo.png" alt="Logo de citas" class="brand-logo">
    </div>

    <!-- Menú Principal -->
    <nav class="main-nav-moderna">
        <a href="index.html" class="active">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>
        <!-- NUEVO: Enlace de Especialistas -->
        <a href="nuestros-especialistas.html">
            <i class="fa-solid fa-stethoscope"></i>
            <span>Especialistas</span>
        </a>
        <a href="nueva-cita.html">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Agendar</span>
        </a>
        <a href="mis-citas.html">
            <i class="fa-solid fa-address-book"></i>
            <span>Citas</span>
        </a>
    </nav>

    <!-- Menú Inferior (Perfil y Salir) -->
    <nav class="bottom-nav-moderna">
        <a id="linkPerfil" href="perfil.html">
            <i class="fa-solid fa-circle-user"></i>
            <span>Perfil</span>
        </a>
        <a id="linkSalir" href="#" onclick="cerrarSesion()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Salir</span>
        </a>
    </nav>

</aside>

<div class="content-wrapper">




<div class="login-wrapper">
    <div class="login-box">
    <h1>Registrar</h1>
    <div class="form-group">
    <label>Nombres y Apellidos</label>
    <input type="text" id="nombre" placeholder="Carlos">
</div>

<div class="form-group">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="margin-bottom: 0;">Numero DNI</label>
        <span id="dniWarning" style="color: #d32f2f; font-size: 12px; font-weight: bold; display: none;">⚠️ Máximo 8 dígitos</span>
    </div>
    <input type="text" id="dni" placeholder="62345678" oninput="verificarLongitudDNI()" style="margin-top: 8px;">
</div>

<div class="form-group">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="margin-bottom: 0;">Contraseña</label>
        <span id="passWarning" style="color: #d32f2f; font-size: 12px; font-weight: bold; display: none;">⚠️ Debe tener al menos 6 caracteres</span>
    </div>
    <input type="password" id="password" placeholder="********" oninput="verificarLongitudPassword()" style="margin-top: 8px;">
</div>


<button type="button" onclick="registrar()">Registrarse</button>
<div class="registro-link" style="text-align: center; margin-top: 20px;">
        <span style="font-size: 14px; color: #555;">¿Ya tienes una cuenta? </span>
        <a href="perfil.html" style="color: #1e88e5; text-decoration: none; font-weight: bold;">Inicia sesión aquí</a>
</div>
<p id="mensajeError" class="error-message" style="margin-top: 10px; color: #d32f2f; display: none;"></p>

</div>

<script>
function verificarLongitudDNI() {
    let dniInput = document.getElementById("dni");
    let warningSpan = document.getElementById("dniWarning");

    // Si escribe más de 8 caracteres, mostramos la advertencia roja
    if (dniInput.value.length > 8) {
        warningSpan.style.display = "inline-block";
        dniInput.style.borderColor = "#d32f2f"; // Pinta el borde de rojo también
        dniInput.style.outlineColor = "#d32f2f";
    } else {
        // Si borra y vuelve a tener 8 o menos, la ocultamos
        warningSpan.style.display = "none";
        dniInput.style.borderColor = "#ccc"; // Vuelve al color original
        dniInput.style.outlineColor = ""; 
    }
}

function verificarLongitudPassword() {
    let passInput = document.getElementById("password");
    let warningSpan = document.getElementById("passWarning");

    // Si ya empezó a escribir (más de 0) pero tiene menos de 6 caracteres
    if (passInput.value.length > 0 && passInput.value.length < 6) {
        warningSpan.style.display = "inline-block";
        passInput.style.borderColor = "#d32f2f"; // Borde rojo
        passInput.style.outlineColor = "#d32f2f";
    } else {
        // Si borra todo o si ya alcanzó los 6 caracteres, ocultamos la alerta
        warningSpan.style.display = "none";
        passInput.style.borderColor = "#ccc"; // Vuelve al color gris normal
        passInput.style.outlineColor = ""; 
    }
}

function updateUserActions() {
    const perfilLink = document.getElementById("linkPerfil");
    const logoutLink = document.getElementById("linkSalir");
    const logged = localStorage.getItem("logueado") === "si";
    if (perfilLink) perfilLink.style.display = logged ? "none" : "inline-block";
    if (logoutLink) logoutLink.style.display = logged ? "inline-block" : "none";
}
updateUserActions();
</script>

<script>
function mostrarError(mensaje) {
    const errorDiv = document.getElementById('mensajeError');
    errorDiv.textContent = mensaje;
    errorDiv.style.display = 'block';
}

function ocultarError() {
    const errorDiv = document.getElementById('mensajeError');
    errorDiv.style.display = 'none';
}

function registrar() {
    ocultarError();

    let nombre = document.getElementById("nombre").value.trim();
    let dni = document.getElementById("dni").value.trim();
    let password = document.getElementById("password").value.trim();

    // Campos vacíos
    if (nombre === "" || dni === "" || password === "") {
        mostrarError("⚠️ Completa todos los campos");
        return;
    }

    // Nombre: solo letras y espacios
    if (!/^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/.test(nombre)) {
        mostrarError("❌ El nombre solo debe contener letras");
        return;
    }

    // DNI: verificar si contiene letras
    if (/[A-Za-z]/.test(dni)) {
        mostrarError("❌ El DNI no puede contener letras");
        return;
    }

    // DNI: verificar si contiene otros caracteres
    if (!/^\d+$/.test(dni)) {
        mostrarError("❌ El DNI solo debe contener números");
        return;
    }

    // DNI: verificar longitud
    if (dni.length !== 8) {
        mostrarError("❌ El DNI debe tener exactamente 8 dígitos");
        return;
    }

    // Contraseña: debe tener letras y números
    if (!/^(?=.*[A-Za-z])(?=.*\d).+$/.test(password)) {
        mostrarError("❌ La contraseña debe contener al menos una letra y un número");
        return;
    }

    // Contraseña: mínimo 6 caracteres
    if (password.length < 6) {
        mostrarError("❌ La contraseña debe tener al menos 6 caracteres");
        return;
    }

    // Verificar si el DNI ya está registrado
    let dniRegistrado = localStorage.getItem("dni");

    if (dniRegistrado === dni) {
        mostrarError("❌ Este DNI ya está registrado");
        return;
    }

    // Guardar datos
    localStorage.setItem("nombre", nombre);
    localStorage.setItem("dni", dni);
    localStorage.setItem("password", password);

    alert("✅ Registro exitoso. Bienvenido " + nombre);

    window.location.href = "perfil.html";
}
</script>
</body>
</html>
