<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas Médicas</title>


    <link rel="stylesheet" href="style.css">
</head>


<body>


<!-- ========================================= -->
<!-- HEADER -->
<!-- ========================================= -->


<header>
    <div class="brand">
        <h1>Sistema de Citas Médicas</h1>
    </div>

<div class="user-actions">
        <a id="linkPerfil" href="perfil.html">Iniciar Sesión</a>
        <a id="linkSalir" href="salir.html" class="btn-logout">Salir</a>
    </div>
</header>

<aside class="sidebar">
    <nav class="main-nav">
        <a href="nueva-cita.html">Nueva Cita</a>
        <a href="mis-citas.html">Mis Citas</a>
        <a href="agenda-medica.html">Agenda Médica</a>
    </nav>
</aside>



<div class="container">


    <h1>Registrar</h1>

    <div class="form-group">
    <label>Nombres y Apellidos</label>
    <input type="text" id="nombre" placeholder="Carlos">
</div>

<div class="form-group">
    <label>Numero DNI</label>
    <input type="text" id="dni" placeholder="62345678">
</div>

<div class="form-group">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="********">
</div>


<button type="button" onclick="registrar()">Registrarse</button>
<p id="mensajeError" class="error-message" style="margin-top: 10px; color: #d32f2f; display: none;"></p>

</div>

<script>
function updateUserActions() {
    const perfilLink = document.getElementById("linkPerfil");
    const logoutLink = document.getElementById("linkSalir");
    const logged = localStorage.getItem("logueado") === "si";
    if (perfilLink) perfilLink.style.display = logged ? "none" : "inline-block";
    if (logoutLink) logoutLink.style.display = logged ? "inline-block" : "none";
}
updateUserActions();
</script>

<script>
function mostrarError(mensaje) {
    const errorDiv = document.getElementById('mensajeError');
    errorDiv.textContent = mensaje;
    errorDiv.style.display = 'block';
}

function ocultarError() {
    const errorDiv = document.getElementById('mensajeError');
    errorDiv.style.display = 'none';
}

function registrar() {
    ocultarError();

    let nombre = document.getElementById("nombre").value.trim();
    let dni = document.getElementById("dni").value.trim();
    let password = document.getElementById("password").value.trim();

    // Campos vacíos
    if (nombre === "" || dni === "" || password === "") {
        mostrarError("⚠️ Completa todos los campos");
        return;
    }

    // Nombre: solo letras y espacios
    if (!/^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/.test(nombre)) {
        mostrarError("❌ El nombre solo debe contener letras");
        return;
    }

    // DNI: verificar si contiene letras
    if (/[A-Za-z]/.test(dni)) {
        mostrarError("❌ El DNI no puede contener letras");
        return;
    }

    // DNI: verificar si contiene otros caracteres
    if (!/^\d+$/.test(dni)) {
        mostrarError("❌ El DNI solo debe contener números");
        return;
    }

    // DNI: verificar longitud
    if (dni.length !== 8) {
        mostrarError("❌ El DNI debe tener exactamente 8 dígitos");
        return;
    }

    // Contraseña: debe tener letras y números
    if (!/^(?=.*[A-Za-z])(?=.*\d).+$/.test(password)) {
        mostrarError("❌ La contraseña debe contener al menos una letra y un número");
        return;
    }

    // Contraseña: mínimo 6 caracteres
    if (password.length < 6) {
        mostrarError("❌ La contraseña debe tener al menos 6 caracteres");
        return;
    }

    // Verificar si el DNI ya está registrado
    let dniRegistrado = localStorage.getItem("dni");

    if (dniRegistrado === dni) {
        mostrarError("❌ Este DNI ya está registrado");
        return;
    }

    // Guardar datos
    localStorage.setItem("nombre", nombre);
    localStorage.setItem("dni", dni);
    localStorage.setItem("password", password);

    alert("✅ Registro exitoso. Bienvenido " + nombre);

    window.location.href = "perfil.html";
}
</script>
</body>
</html>
