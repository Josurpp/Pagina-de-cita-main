<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas Médicas</title>


    <link rel="stylesheet" href="style.css">
</head>


<body>


<!-- ========================================= -->
<!-- HEADER -->
<!-- ========================================= -->


<header>
    <div class="brand">
        <h1>Sistema de Citas Médicas</h1>
    </div>

</header>

<aside class="sidebar">
    <nav class="main-nav">
        <a href="nueva-cita.html">Nueva Cita</a>
        <a href="mis-citas.html">Mis Citas</a>
        <a href="agenda-medica.html">Agenda Médica</a>
    </nav>
</aside>



<div class="container">


    <h1>Iniciar Sesión</h1>


    <div class="form-group">
        <label>Numero DNI</label>
        <input type="text" id="dni" placeholder="62345678">
    </div>


    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="********">
    </div>


    <button onclick="iniciarSesion()">Ingresar</button>
    <button onclick="window.open('registro.html', '_self')">Registrar</button>


</div>
<script>
function iniciarSesion() {

    let dni = document.getElementById("dni").value;
    let password = document.getElementById("password").value;

    let dniRegistrado = localStorage.getItem("dni");
    let passwordRegistrada = localStorage.getItem("password");

    if(dniRegistrado === null || passwordRegistrada === null){
        alert("No existe una cuenta registrada. Regístrate si aún no tienes una cuenta.");
        return;
    }

    if(dni === dniRegistrado && password === passwordRegistrada){
        localStorage.setItem("logueado", "si");
        alert("Inicio de sesión exitoso");
        window.location.href = "nueva-cita.html";
    } else {
        alert("Esta cuenta no existe. Verifica tus datos o regístrate si no tienes una cuenta.");
    }
}
</script>
<script>
function updateUserActions() {
    const perfilLink = document.getElementById("linkPerfil");
    const logoutLink = document.getElementById("linkSalir");
    const logged = localStorage.getItem("logueado") === "si";
    if (perfilLink) perfilLink.style.display = logged ? "none" : "inline-block";
    if (logoutLink) logoutLink.style.display = logged ? "inline-block" : "none";
}
updateUserActions();
</script>
</body>
</html>
