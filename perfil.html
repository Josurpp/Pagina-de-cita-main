<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas Médicas</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    
</head>

<body>

<aside class="sidebar-moderna">
    
    <div class="brand-moderna">
        <i class="fa-solid fa-notes-medical logo-icon"></i>
        <h2>Citame</h2>
    </div>

    <nav class="main-nav-moderna">
        <a href="index.html">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>
        <a href="nuestros-especialistas.html">
            <i class="fa-solid fa-stethoscope"></i>
            <span>Especialistas</span>
        </a>
        <a href="nueva-cita.html">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Agendar</span>
        </a>
        <a href="mis-citas.html">
            <i class="fa-solid fa-address-book"></i>
            <span>Citas</span>
        </a>
    </nav>

    <nav class="bottom-nav-moderna">
        <a id="linkPerfil" href="perfil.html" class="active">
            <i class="fa-solid fa-circle-user"></i>
            <span>Perfil</span>
        </a>
        <a id="linkSalir" href="#" onclick="cerrarSesion()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Salir</span>
        </a>
    </nav>

</aside>

<div class="content-wrapper" style="padding: 0;">

    <div class="login-wrapper">
        <div class="login-box">
            <h1>Iniciar Sesión</h1>

            <div class="form-group">
                <label>Número DNI</label>
                <input type="text" id="dni" placeholder="62345678">
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="********">
            </div>

            <button onclick="iniciarSesion()">Ingresar</button>
            
            <div class="registro-link">
                <br>
                <span>¿Aún no tienes cuenta? </span>
                <a href="registro.html">Regístrate aquí</a>
            </div>

            <p id="mensajeError" class="error-message" style="margin-top: 15px; color: #ff8a80; display: none; text-align: center; font-weight: bold;"></p>
            <p id="mensajePendiente" class="info-message" style="margin-top: 15px; text-align: center;"></p>
        </div>
    </div>

</div>

<script>
function mostrarError(mensaje) {
    const errorDiv = document.getElementById('mensajeError');
    errorDiv.textContent = mensaje;
    errorDiv.style.display = 'block';
}

function ocultarError() {
    const errorDiv = document.getElementById('mensajeError');
    errorDiv.style.display = 'none';
}

function iniciarSesion() {
    ocultarError();
    
    let dni = document.getElementById("dni").value.trim();
    let password = document.getElementById("password").value.trim();

    if(dni === "" || password === ""){
        mostrarError("⚠️ Completa todos los campos");
        return;
    }

    if(dni.length !== 8 || isNaN(dni)){
        mostrarError("❌ El DNI debe tener exactamente 8 dígitos numéricos");
        return;
    }

    let dniRegistrado = localStorage.getItem("dni");
    let passwordRegistrada = localStorage.getItem("password");
    let pendingCita = JSON.parse(localStorage.getItem('pendingCita') || 'null');

    if(dniRegistrado === null || passwordRegistrada === null){
        mostrarError("❌ Esta cuenta no existe. Regístrate para crear una nueva");
        return;
    }

    if(dni !== dniRegistrado){
        mostrarError("❌ DNI incorrecto");
        return;
    }

    if(password !== passwordRegistrada){
        mostrarError("❌ Contraseña incorrecta");
        return;
    }

    localStorage.setItem("logueado", "si");
    if (pendingCita) {
        const nombreUsuario = localStorage.getItem('nombre') || 'Paciente';
        pendingCita.dni = dni;
        pendingCita.paciente = nombreUsuario;
        let citasActuales = JSON.parse(localStorage.getItem('citas') || '[]');
        citasActuales.push(pendingCita);
        localStorage.setItem('citas', JSON.stringify(citasActuales));
        localStorage.removeItem('pendingCita');
        alert("✅ Inicio de sesión exitoso. Tu cita fue guardada.");
        window.location.href = "mis-citas.html";
    } else {
        alert("✅ Inicio de sesión exitoso");
        window.location.href = "nueva-cita.html";
    }
}

function mostrarMensajePendiente() {
    const mensaje = document.getElementById('mensajePendiente');
    const pendingCita = JSON.parse(localStorage.getItem('pendingCita') || 'null');
    if (pendingCita) {
        mensaje.textContent = 'Tienes una cita pendiente guardada. Inicia sesión para verla en Mis Citas.';
    }
}

mostrarMensajePendiente();
</script>

<script>
function updateUserActions() {
    const perfilLink = document.getElementById("linkPerfil");
    const logoutLink = document.getElementById("linkSalir");
    const logged = localStorage.getItem("logueado") === "si";
    
    // Corregido a 'flex' para mantener la estructura robusta del sidebar expandido
    if (perfilLink) perfilLink.style.display = logged ? "none" : "flex";
    if (logoutLink) logoutLink.style.display = logged ? "flex" : "none";
}
updateUserActions();
</script>
</body>
</html>
