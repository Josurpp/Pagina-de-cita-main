<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas Médicas</title>


    <link rel="stylesheet" href="style.css">
</head>


<body>


<!-- ========================================= -->
<!-- HEADER -->
<!-- ========================================= -->


<header>
    <div class="brand">
        <h1>Sistema de Citas Médicas</h1>
    </div>

</header>

<aside class="sidebar">
    <nav class="main-nav">
        <a href="nueva-cita.html">Nueva Cita</a>
        <a href="mis-citas.html">Mis Citas</a>
        <a href="nuestros-especialistas.html">Especialistas</a>
    </nav>
</aside>



<div class="login-wrapper">
    <div class="login-box">
        <h1>Iniciar Sesión</h1>

        <div class="form-group">
            <label>Numero DNI</label>
            <input type="text" id="dni" placeholder="62345678">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="********">
        </div>

        <button onclick="iniciarSesion()">Ingresar</button>
        
        <div class="registro-link" style="text-align: center; margin-top: 20px;">
            <span style="font-size: 14px; color: #555;">¿Aún no tienes cuenta? </span>
            <a href="registro.html" style="color: #1e88e5; text-decoration: none; font-weight: bold;">Regístrate aquí</a>
        </div>

        <p id="mensajeError" class="error-message" style="margin-top: 15px; color: #d32f2f; display: none; text-align: center;"></p>
        <p id="mensajePendiente" class="info-message" style="margin-top: 15px; color: #333; text-align: center;"></p>
    </div>
</div>


</div>
<script>
function mostrarError(mensaje) {
    const errorDiv = document.getElementById('mensajeError');
    errorDiv.textContent = mensaje;
    errorDiv.style.display = 'block';
}

function ocultarError() {
    const errorDiv = document.getElementById('mensajeError');
    errorDiv.style.display = 'none';
}

function iniciarSesion() {
    ocultarError();
    
    let dni = document.getElementById("dni").value.trim();
    let password = document.getElementById("password").value.trim();

    if(dni === "" || password === ""){
        mostrarError("⚠️ Completa todos los campos");
        return;
    }

    if(dni.length !== 8 || isNaN(dni)){
        mostrarError("❌ El DNI debe tener exactamente 8 dígitos numéricos");
        return;
    }

    let dniRegistrado = localStorage.getItem("dni");
    let passwordRegistrada = localStorage.getItem("password");
    let pendingCita = JSON.parse(localStorage.getItem('pendingCita') || 'null');

    if(dniRegistrado === null || passwordRegistrada === null){
        mostrarError("❌ Esta cuenta no existe. Regístrate para crear una nueva");
        return;
    }

    if(dni !== dniRegistrado){
        mostrarError("❌ DNI incorrecto");
        return;
    }

    if(password !== passwordRegistrada){
        mostrarError("❌ Contraseña incorrecta");
        return;
    }

    localStorage.setItem("logueado", "si");
    if (pendingCita) {
        const nombreUsuario = localStorage.getItem('nombre') || 'Paciente';
        pendingCita.dni = dni;
        pendingCita.paciente = nombreUsuario;
        let citasActuales = JSON.parse(localStorage.getItem('citas') || '[]');
        citasActuales.push(pendingCita);
        localStorage.setItem('citas', JSON.stringify(citasActuales));
        localStorage.removeItem('pendingCita');
        alert("✅ Inicio de sesión exitoso. Tu cita fue guardada.");
        window.location.href = "mis-citas.html";
    } else {
        alert("✅ Inicio de sesión exitoso");
        window.location.href = "nueva-cita.html";
    }
}

function mostrarMensajePendiente() {
    const mensaje = document.getElementById('mensajePendiente');
    const pendingCita = JSON.parse(localStorage.getItem('pendingCita') || 'null');
    if (pendingCita) {
        mensaje.textContent = 'Tienes una cita pendiente guardada. Inicia sesión para verla en Mis Citas.';
    }
}

mostrarMensajePendiente();
</script>
<script>
function updateUserActions() {
    const perfilLink = document.getElementById("linkPerfil");
    const logoutLink = document.getElementById("linkSalir");
    const logged = localStorage.getItem("logueado") === "si";
    if (perfilLink) perfilLink.style.display = logged ? "none" : "inline-block";
    if (logoutLink) logoutLink.style.display = logged ? "inline-block" : "none";
}
updateUserActions();
</script>
</body>
</html>
