<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Especialistas - Sistema de Citas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="brand">
        <h1>Sistema de Citas Médicas</h1>
    </div>

    <div class="user-actions" style="display: flex; align-items: center; gap: 15px;">
        <a id="linkPerfil" href="perfil.html" title="Iniciar Sesión">
            <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" 
                 alt="Iniciar Sesión" 
                 style="width: 35px; height: 35px; vertical-align: middle;">
        </a>
        <a id="linkSalir" href="#" onclick="cerrarSesion()" class="btn-logout">Salir</a>
    </div>
</header>

<aside class="sidebar">
    <nav class="main-nav">
        <a href="nueva-cita.html">Nueva Cita</a>
        <a href="mis-citas.html">Mis Citas</a>
        <a href="nuestros-especialistas.html" class="active">Especialistas</a>
    </nav>
</aside>

<div class="container">

    <h1 id="tituloBienvenida">Nuestros Especialistas</h1>
    <p style="color: #666; margin-bottom: 20px;">Selecciona una especialidad para conocer a los médicos disponibles.</p>

    <div style="margin-bottom: 25px;">
        <label style="display: block; font-weight: bold; margin-bottom: 8px;">Filtrar por Especialidad:</label>
        <select id="filtroEspecialidad" style="padding: 10px; width: 100%; max-width: 350px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px;">
            <option value="">-- Seleccione una Especialidad --</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Médico</th>
                <th>Especialidad</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="tablaMedicos">
            <tr>
                <td colspan="3" style="text-align: center; color: #888; padding: 20px;">
                    Por favor, elija una especialidad arriba para ver el staff médico.
                </td>
            </tr>
        </tbody>
    </table>

</div>

<script>
// Arreglos de datos oficiales
const ForumEspecialidades = [
    "Cardiología",
    "Pediatría",
    "Dermatología",
    "Medicina General"
];

const medicos = [
    { id: 1, nombre: "Dr. Pérez", especialidad: "Cardiología", estado: "Activo" },
    { id: 2, nombre: "Dra. Gómez", especialidad: "Cardiología", estado: "Activo" },
    { id: 3, nombre: "Dr. Morales", especialidad: "Cardiología", estado: "Activo" },
    { id: 4, nombre: "Dra. Sánchez", especialidad: "Cardiología", estado: "Activo" },
    { id: 5, nombre: "Dr. Rodríguez", especialidad: "Pediatría", estado: "Activo" },
    { id: 6, nombre: "Dra. Ruiz", especialidad: "Pediatría", estado: "Activo" },
    { id: 7, nombre: "Dra. Fernández", especialidad: "Pediatría", estado: "Activo" },
    { id: 8, nombre: "Dr. Torres", especialidad: "Dermatología", estado: "Activo" },
    { id: 9, nombre: "Dra. Álvarez", especialidad: "Dermatología", estado: "Activo" },
    { id: 10, nombre: "Dr. Castillo", especialidad: "Dermatología", estado: "Activo" },
    { id: 11, nombre: "Dr. López", especialidad: "Medicina General", estado: "Activo" },
    { id: 12, nombre: "Dra. Martínez", especialidad: "Medicina General", estado: "Activo" },
    { id: 13, nombre: "Dr. Herrera", especialidad: "Medicina General", estado: "Activo" }
];

// 1. Poblamos el selector de especialidades al cargar la página
const filtroSelect = document.getElementById("filtroEspecialidad");
ForumEspecialidades.forEach(e => {
    let option = document.createElement("option");
    option.text = e;
    option.value = e;
    filtroSelect.add(option);
});

// 2. Evento para detectar cuando el usuario cambia de especialidad
filtroSelect.addEventListener("change", () => {
    const espSeleccionada = filtroSelect.value;
    const tbody = document.getElementById("tablaMedicos");
    
    // Si vuelve a la opción por defecto ("-- Seleccione --")
    if (!espSeleccionada) {
        tbody.innerHTML = `
            <tr>
                <td colspan="3" style="text-align: center; color: #888; padding: 20px;">
                    Por favor, elija una especialidad arriba para ver el staff médico.
                </td>
            </tr>`;
        return;
    }

    // Filtrar los médicos
    const medicosFiltrados = medicos.filter(m => m.especialidad === espSeleccionada);
    
    tbody.innerHTML = ""; // Limpiamos la tabla

    // Pintamos los médicos que coincidan
    medicosFiltrados.forEach(m => {
        // Validación visual por si en el futuro cambian el estado a "Inactivo"
        const claseEstado = m.estado === "Activo" ? "status-atendida" : "status-programada"; 
        const colorTexto = m.estado === "Activo" ? "#2e7d32" : "#c62828"; // Verde para activo, Rojo para inactivo

        tbody.innerHTML += `
            <tr>
                <td style="font-weight: bold; color: #333;">${m.nombre}</td>
                <td>${m.especialidad}</td>
                <td>
                    <span class="${claseEstado}" style="padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: ${colorTexto};">
                        ${m.estado}
                    </span>
                </td>
            </tr>
        `;
    });
});
</script>

<script>
// Función para destruir los datos de sesión correctamente
function cerrarSesion() {
    localStorage.removeItem("logueado");
    localStorage.removeItem("dni");
    localStorage.removeItem("nombre");
    
    // Redirigir al inicio de sesión
    window.location.href = "perfil.html"; 
}

// Función para manejar la interfaz y la bienvenida de esta página
function updateUI() {
    const perfilLink = document.getElementById("linkPerfil");
    const logoutLink = document.getElementById("linkSalir");
    const tituloBienvenida = document.getElementById("tituloBienvenida");

    const logged = localStorage.getItem("logueado") === "si";
    const nombreUsuario = localStorage.getItem("nombre");

    // Ocultar o Mostrar botones
    if (perfilLink) perfilLink.style.display = logged ? "none" : "inline-block";
    if (logoutLink) logoutLink.style.display = logged ? "inline-block" : "none";

    // Personalizar el mensaje con el nombre del usuario
    if (logged && nombreUsuario && tituloBienvenida) {
        tituloBienvenida.textContent = "Especialistas disponibles para ti, " + nombreUsuario;
    }
}

// Ejecutar al cargar la página
updateUI();
</script>
</body>
</html>
