<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - Sistema de Citas Médicas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e88e5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e88e5;
            box-shadow: 0 0 5px rgba(30, 136, 229, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1e88e5;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: #1565c0;
        }

        .error-message {
            background: #ffebee;
            color: #e53935;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #e53935;
        }

        .success-message {
            background: #e8f5e9;
            color: #43a047;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #43a047;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #1e88e5;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <h2>Panel Administrador</h2>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm" onsubmit="iniciarSesionAdmin(event)">
            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required autofocus>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="back-link">
            <p>¿No eres administrador?</p>
            <a href="index.html">Volver a inicio</a>
        </div>
    </div>
</div>

<script>
    // Verificar si ya está logueado como admin
    window.addEventListener('load', function() {
        const adminLogueado = localStorage.getItem('adminLogueado') === 'si';
        if (adminLogueado) {
            mostrarMensaje('Ya estás logueado como administrador.', 'success');
            setTimeout(() => {
                window.location.href = 'admin-panel.html';
            }, 1000);
        }
    });

    function iniciarSesionAdmin(event) {
        event.preventDefault();
        
        const usuario = document.getElementById('usuario').value.trim();
        const contrasena = document.getElementById('contrasena').value;
        
        const usuarioValido = 'admin';
        const contrasenaValida = 'admin123';
        
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        
        // Limpiar mensajes previos
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        
        if (usuario === usuarioValido && contrasena === contrasenaValida) {
            localStorage.setItem('adminLogueado', 'si');
            mostrarMensaje('¡Bienvenido! Redirigiendo al panel...', 'success');
            
            setTimeout(() => {
                window.location.href = 'admin-panel.html';
            }, 1000);
        } else {
            mostrarMensaje('Usuario o contraseña incorrectos.', 'error');
            document.getElementById('contrasena').value = '';
            document.getElementById('usuario').focus();
        }
    }

    function mostrarMensaje(texto, tipo) {
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        
        if (tipo === 'error') {
            errorDiv.textContent = texto;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        } else {
            successDiv.textContent = texto;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }
    }
</script>

</body>
</html>
