<!-- ========================================= -->
<!-- SISTEMA DE CITAS MÉDICAS - HTML5 WIREFRAME -->
<!-- ========================================= -->


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Inicio - Sistema de Citas Médicas</title>


    <link rel="stylesheet" href="style.css">
</head>


<body>


<!-- ========================================= -->
<!-- HEADER -->
<!-- ========================================= -->


<header>
    <div class="brand">
        <h1>Sistema de Citas Médicas</h1>
    </div>

    <div class="user-actions" style="display: flex; align-items: center; gap: 15px;">
        <a id="linkPerfil" href="perfil.html" title="Iniciar Sesión">
            <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" 
                 alt="Iniciar Sesión" 
                 style="width: 35px; height: 35px; vertical-align: middle; transition: transform 0.2s;">
        </a>
        
        <a id="linkSalir" href="salir.html" class="btn-logout">Salir</a>
    </div>
</header>

<aside class="sidebar">
    <nav class="main-nav">
        <a href="nueva-cita.html">Nueva Cita</a>
        <a href="mis-citas.html">Mis Citas</a>
        <a href="nuestros-especialistas.html">Especialistas</a>
    </nav>
</aside>


<div class="content-wrapper">



<div class="container">


    <h1>Página de Inicio</h1>


    <div class="cards">


        <div class="card">
            <h3>Nueva Cita</h3>
            <p>Registrar una nueva consulta médica.</p>
            <button onclick="irA('nueva-cita.html')">Ir</button>
        </div>


        <div class="card">
            <h3>Mis Citas</h3>
            <p>Consultar próximas citas e historial.</p>
            <button onclick="irA('mis-citas.html')">Ir</button>
        </div>


        <div class="card">
            <h3>Agenda Médica</h3>
            <p>Visualizar agenda diaria o semanal.</p>
            <button onclick="irA('agenda-medica.html')">Ir</button>
        </div>


    </div>


</div>
<script>
function updateUserActions() {
    const perfilLink = document.getElementById("linkPerfil");
    const logoutLink = document.getElementById("linkSalir");
    const logged = localStorage.getItem("logueado") === "si";
    if (perfilLink) perfilLink.style.display = logged ? "none" : "inline-block";
    if (logoutLink) logoutLink.style.display = logged ? "inline-block" : "none";
}

function irA(dest) {
    window.location.href = dest;
}

updateUserActions();
</script>
</body>
</html>
